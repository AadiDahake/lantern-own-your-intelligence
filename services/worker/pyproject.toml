[project]
name = "lantern-worker"
version = "0.1.0"
description = "Lantern escalation worker: files GitHub issues, drafts pull requests, pauses for approval, merges and waits for the deployment."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2.0",
    "requests>=2.32",
    "mcp>=1.9",
    "pydantic>=2.7",
    # Reads the GitHub token the dashboard encrypted; see steps/github_token.py.
    "cryptography>=42",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
